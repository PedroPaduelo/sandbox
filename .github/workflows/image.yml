# Publica a imagem do sandbox no GHCR a cada push.
#
# O deploy deixa de depender do repositorio: o painel faz deploy da IMAGEM
# (ghcr.io/pedropaduelo/sandbox-agent), sem clone nem build na VPS. O push usa
# o GITHUB_TOKEN do proprio workflow — nenhum token pessoal fica no repo.
name: image

on:
  push:
    branches: [main, gvisor]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sandbox-agent
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
